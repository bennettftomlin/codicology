[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codicology"
version = "0.1.0"
description = "Turn book captures — video, photos, scans, born-digital PDFs — into clean PDFs and OCR'd EPUBs, with the checks that keep the result honest"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bennett Tomlin" }]
dependencies = [
    # The headless wheel, because that is the one Surya pins
    # (opencv-python-headless==4.11.0.86 at surya-ocr 0.22.1) and every
    # OpenCV wheel unpacks into the same cv2 directory: asking for
    # opencv-python here installed both, and the unpinned one won. Nothing
    # in this package opens a window. `codicology doctor` reports which
    # OpenCV actually imports.
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "pypdfium2>=4.0",
    "pymupdf>=1.24",
    "lxml>=4.9",
    # The word pattern is written in Unicode properties (\p{L}\p{M}), which
    # the standard library's re does not have. transformers brings this in
    # already for anyone with the surya extra.
    "regex>=2023.8.8",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
# The page rectifier for photographed and filmed pages: UVDoc, served
# through transformers from the Hub (PaddlePaddle/UVDoc_safetensors, ~30
# MB, fetched on first use). Without it, captures are kept as photographed
# and the build says so; with it, perspective, curl and the spine's crease
# come out in one pass. torch picks the Mac GPU (mps) or CUDA when present.
geometry = ["transformers>=5.14", "torch>=2.2", "safetensors>=0.4", "scikit-image>=0.22"]
# The OCR backend. There is one.
# Surya is pinned to the exact version this pipeline is developed and
# tested against: its API has broken across minor versions before, and
# v0.20.0 moved inference into an external server (llama.cpp on CPU and
# Apple Silicon, vllm on NVIDIA) — a requirement invisible to imports.
# Move the pin deliberately, with a real book, then update SuryaBackend
# if the shape shifted. `codicology doctor --full` proves an environment.
surya = ["surya-ocr==0.22.1"]
heif = ["pillow-heif"]
dev = ["pytest>=8"]

[project.scripts]
codicology = "codicology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
